[project]
name = "ctf-agent"
version = "0.1.0"
description = "CTF AI Agent framework - Cairn-based extension layer initialized from the design doc"
# 目标运行时为 Python >= 3.12（与 Cairn 一致）；3.9 兼容已移除。
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit"]
