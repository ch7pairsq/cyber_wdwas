# 正式赛配置（arena 协议 / 平台托管 harness 启动）。
#
# 2026-11 官方规则口径：
# - 一次性答题机会：整场只有 1 次，结束不能重开 → 所有预算宁可偏大，
#   崩溃由 scripts/run_official.sh 的 supervisor 续跑（同一 DB 断点恢复）。
# - 27 题、4 小时连续计时（从开始答题起，不能暂停）→ 启动传
#   --seconds = 4h - 收尾余量（scripts/run_official.sh 默认 13800s）。
# - 排名 tiebreaker 是有效耗时（首次平台 API 调用 → 最后一次得分）：
#   先易后难快拿分、gate 确认即滚动提交（机制已就位）。
# - 3 个题目环境并发上限 → parallel_agents / max_envs / max_running_projects
#   三处保持一致。
#
# 注意：不要把 app.mode 设为 "competition"——config.py 校验会强制要求
# protocol=official（遗留占位），实际平台是 arena 协议。
app:
  mode: practice

concurrency:
  max_workers: 4
  # 题内串行：同题同时只跑 1 个意图（会话状态共享，并发写会打架）。
  max_project_workers: 1
  # 平台环境上限 3 个（409 environment_limit）：在跑题数不超过 3。
  max_running_projects: 3
  executor: serial

budget:
  # 2026-11-21 与 arena.yaml 同步放宽（600k/1500s 旧值的教训：正式赛
  # static_file_server 三次尝试 46 步即耗尽 600k）。正式入口
  # scripts/run_official.sh 固定用本文件，此处不同步则 v8 校准永不生效。
  # 取消单题短窗口限制，只保留防死循环护栏（stall/repeat/步数止损）；
  # 单题时限接近运行总时长，由 absolute_deadline 与 supervisor 墙钟兜底。
  per_challenge_seconds: 12000
  claim_timeout_seconds: 3600
  max_model_tokens_per_intent: 5000000
  max_tool_calls_per_intent: 1000
  # 运行级全局 token 上限：0 = 不设（用户 2026-11-21 决定，300 元额度
  # 只靠时间+步数限制约束）；用量账本仍持久化，可在库里看实耗。
  max_model_tokens_total: 0
  repeat_limit: 6
  stall_steps: 30
  # 终局加时：全部可解题做完且剩余时间 > endgame_min_seconds 时，对预算
  # 耗尽（stopped）的题授权一次追加额度——token/工具上限 ×(1+bonus)、
  # 会话有效期延到运行截止。0 = 关闭。累计账本不清零，硬停止语义保留。
  endgame_token_bonus: 2.0
  # Pro（换挡模型）每题调用硬上限：防烧穿全局预算；Pro/Flash 走同一账本。
  pro_max_calls_per_challenge: 8

download:
  max_single_bytes: 20971520
  max_total_bytes: 104857600

runtime:
  # v12 教训（2026-11-21 正式赛第 2 题）：默认 4 个意图（1 triage + 3
  # followup）全被 gate 拒绝后无新意图，run 提前 idle 退出、整题零提交。
  # 单题意图上限提高到 12：短 followup（2-3 轮）成本低，配合 best-effort
  # 提交 + REJECTED 重开形成平台反馈循环；token/时间预算墙仍兑底。
  max_intents_per_challenge: 12

submission:
  # best-effort 提交：gate 未确认（rejected/pending）但格式合法的候选仍
  # 入队，平台真值仲裁。依据：官方平台错提交无计分惩罚（correct=False
  # awarded=0，tiebreaker 只统计得分事件），而 gate 拒绝 ≠ 平台拒绝——
  # v12 第 2 题 gate 四次拒绝导致零提交零得分。gateway 同题同答幂等去重
  # 防重发，垃圾候选上界 = 单题意图数。practice 配置不开（错提交在那里
  # 有语义成本）。
  best_effort_on_reject: true

policy:
  authorized_scope: []
  web_search: false
  runtime_install: false
  sandbox_required: false
  command_allowlist:
  - python3
  - unzip
  - zip
  - xz
  - bzip2
  - zstd
  - strings
  - objdump
  - readelf
  - nm
  - file
  - binwalk
  - foremost
  - fls
  - icat
  - mmls
  - exiftool
  - 7z
  - steghide
  - pngcheck
  - openssl
  - xxd
  - jq
  - gdb
  - pwn
  - ROPgadget
  - cstool
  - checksec
  - patchelf
  - git
  - z3
  - strace
  - ltrace
  - qemu-x86_64
  - qemu-aarch64
  - pdftotext
  - pdfinfo
  - qrencode
  - tesseract
  - zbarimg
  - java
  - javac
  - jar
  - procyon
  - apktool
  - go
  - gofmt
  authorized_arena_targets:
  - 10.201.0.0/16

model:
  # 2026-11-20 切换 DeepSeek 官方 API（OpenAI Chat Completions 兼容，api.deepseek.com）。
  provider: deepseek_official_openai
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: BAIZHI_API_KEY   # 注入名不变；值为 DeepSeek 官方 API key
  max_tokens: 4096
  tools_enabled: true
  # 双模型换挡：stage>=pro_from_stage 的换路径回合与提交前评审路由到 Pro
  # （同一官方端点同一凭据）；调用失败/每题次数超限自动回退主模型（fail-open）。
  pro_model: deepseek-v4-pro
  pro_from_stage: 2
  # 思考模式按步数路线阶段分配预算（token），0=关：侦察不开思考、攻坚多想；
  # 官方通道映射为 thinking: {"type": "enabled"}（攻坚档 reasoning_effort=high）。
  thinking_by_stage: [0, 4000, 8000, 0, 0]

storage:
  db_path: data/official.db

controller:
  # 与 arena.yaml 2026-11-21 校准一致：步数窗口按意图重置
  # （reset_intent_window），旧阈值 [30,50,70,100] 导致 pro 档永远触达
  # 不了，全程 stage0 盲试。前移后：8 步轻思考、16 步启用 pro 换路径、
  # 24 步深水。
  # v11.5 教训（2026-11-21 正式赛 static_file_server）：心跳止损曾设在
  # 32 步——每轮 ≈2 步（1 模型预留 + 1 工具预留），16 轮即踩线，探索型
  # 题目首轮被 stage4（active_slots=0）硬杀。心跳线必须放到单个 attempt
  # 的 max_tool_rounds=40（≈80-100 步）之外：96 步 ≈ 48 轮，attempt 能
  # 自然收尾；防死循环由 stall_steps/repeat_limit/预算三重兜底。
  thresholds:
  - 8
  - 16
  - 24
  - 96
  # 步数硬上限需大于心跳阈值（96），否则步数墙先于心跳触发。
  max_steps: 120
  # 跨题并行 worker 数：对齐平台 3 环境上限（题内串行见 concurrency）。
  parallel_acceptance: true
  parallel_agents: 3
  max_tool_rounds: 40

harness:
  protocol: arena
  competition_locked: false
  arena:
    # 平台 API 地址；正式赛如变更以裁判组公告为准。
    base_url: http://10.201.0.77:8090
    auto_start: true
    # on_demand: 每个意图执行前按需拉起环境，省槽位。
    env_policy: on_demand
    max_envs: 3
    client_timeout_seconds: 40
    # startup 阶段平台 5xx（resource_unavailable 等未就绪状态）的退避重试；
    # 每次启动最多 20 次 × 30s ≈ 10 分钟，supervisor 3 次重启合计约 30 分钟。
    startup_retry_attempts: 20
    startup_retry_seconds: 30
