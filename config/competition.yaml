# 正式覆盖：赛前构建、仅公司 DeepSeek、禁止搜索与运行时安装。
# 第 2.2 节 Harness 规范待提供；此配置保持 fail closed。
app:
  mode: "competition"

model:
  provider: "baizhi_anthropic"
  base_url: "https://ai-api-gateway.app.baizhi.cloud/api/anthropic"
  model: "deepseek-flash"
  api_key_env: "BAIZHI_API_KEY"

policy:
  web_search: false
  runtime_install: false
  authorized_scope: []  # 官方 Harness 端点待确认；不启用公共网页访问

storage:
  db_path: "data/competition.db"

budget:
  per_challenge_seconds: 900   # §23.3 基线：单题 ≤ 900s

download:
  # X 未确认前保持 0 = 禁止下载
  max_single_bytes: 0
  max_total_bytes: 0

harness:
  protocol: "official"
  official_sdk_ready: false    # 官方 SDK 就绪后由负责人改为 true
  competition_locked: true     # 参赛机会锁：整场一次正式提交
