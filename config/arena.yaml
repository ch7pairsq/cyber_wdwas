runtime:
  worker_lease_seconds: 180
  heartbeat_seconds: 15
  intent_poll_seconds: 2
  retry_backoff_seconds: 2
app:
  mode: practice
concurrency:
  max_workers: 4
  # 题内串行：同题同时只跑 1 个意图（会话状态共享，并发写会打架）。
  # 跨题并行度由 controller.parallel_agents 控制。
  max_project_workers: 1
  # 平台环境上限 3 个（409 environment_limit）：在跑题数不超过 3。
  max_running_projects: 3
  executor: serial
budget:
  # 2026-11-21 按“用足 300 元 API 预算”放宽：取消单题短窗口限制，
  # 只保留全局 token 保险丝与防死循环护栏（stall/repeat/步数止损）。
  # 单题时限接近运行总时长（absolute_deadline 兜底）。
  per_challenge_seconds: 12000
  claim_timeout_seconds: 3600
  # 单题累计 token 上限：600k → 5M（原正式赛 static_file_server
  # 三次尝试 46 步即耗尽 600k 的直接原因）
  max_model_tokens_per_intent: 5000000
  max_tool_calls_per_intent: 1000
  # 运行级全局 token 上限：0 = 不设（用户 2026-11-21 决定，300 元额度
  # 只靠时间+步数限制约束）；用量账本仍持久化，可在库里看实耗
  max_model_tokens_total: 0
  repeat_limit: 6
  stall_steps: 30
  # 终局加时：全部可解题做完且剩余时间 > endgame_min_seconds 时，对预算
  # 耗尽（stopped）的题授权一次追加额度——token/工具上限 ×(1+bonus)、
  # 会话有效期延到运行截止。0 = 关闭。累计账本不清零，硬停止语义保留。
  endgame_token_bonus: 2.0
  # Pro（换挡模型）每题调用硬上限：防烧穿全局预算；Pro/Flash 走同一账本。
  pro_max_calls_per_challenge: 8
download:
  max_single_bytes: 20971520
  max_total_bytes: 104857600
policy:
  authorized_scope: []
  web_search: false
  runtime_install: false
  sandbox_required: false
  command_allowlist:
  - python3
  - unzip
  - zip
  - xz
  - bzip2
  - zstd
  - strings
  - objdump
  - readelf
  - nm
  - file
  - binwalk
  - foremost
  - fls
  - icat
  - mmls
  - exiftool
  - 7z
  - steghide
  - pngcheck
  - openssl
  - xxd
  - jq
  - gdb
  - pwn
  - ROPgadget
  - cstool
  - checksec
  - patchelf
  - git
  - z3
  - strace
  - ltrace
  - qemu-x86_64
  - qemu-aarch64
  - pdftotext
  - pdfinfo
  - qrencode
  - tesseract
  - zbarimg
  - java
  - javac
  - jar
  - procyon
  - apktool
  - go
  - gofmt
  authorized_arena_targets:
  - 10.201.0.0/16
model:
  # 2026-11-20 切换 DeepSeek 官方 API（OpenAI Chat Completions 兼容，api.deepseek.com）。
  provider: deepseek_official_openai
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: BAIZHI_API_KEY   # 注入名不变；值为 DeepSeek 官方 API key
  max_tokens: 4096
  tools_enabled: true
  # 双模型换挡（借鉴 Tsecbench 冠军方案"Flash 高频探索 + Pro 关键决策"）：
  # stage>=pro_from_stage 的换路径回合与提交前评审路由到 Pro（同一官方端点
  # 同一凭据）；调用失败/每题次数超限自动回退主模型（fail-open）。
  pro_model: deepseek-v4-pro
  pro_from_stage: 2
  # 旋钮一：思考模式按步数路线阶段分配预算（token），0=关。对应口诀
  # "侦察关思考（防 Flash 思维过载），攻坚多想（Pro 控预算）"：
  # stage0 侦察/简单验证不开思考；stage1 轻思考；stage2 换路径攻坚开大；
  # stage3/4 止损阶段归零。官方通道按官方 OpenAI 格式映射为
  # thinking: {"type": "enabled"}（攻坚档 reasoning_effort=high）；
  # 参数被拒时 Worker 自动粘滞回退。
  # Pro 深思考轮数由 budget.pro_max_calls_per_challenge 兜底（每题 ≤8 次）。
  thinking_by_stage: [0, 4000, 8000, 0, 0]
storage:
  db_path: data/practice.db
controller:
  # 2026-11-21 校准：步数窗口按意图重置（reset_intent_window），而单意图
  # 预算（1500s/600k tokens）实测仅够 20-26 步——旧阈值 [30,50,70,100]
  # 导致 pro 档（stage2=50 步）永远触达不了，全程 stage0 盲试（正式赛
  # static_file_server 三次尝试 46 步未进 stage1 的教训）。前移后：
  # 8 步轻思考、16 步启用 pro 换路径、24 步深水。
  # v11.5 教训：心跳止损曾设在 32 步——每轮 ≈2 步（1 模型预留 + 1 工具
  # 预留），16 轮即踩线被 stage4 硬杀（与 official-arena.yaml 同步修正）。
  # 心跳线放到 max_tool_rounds=40（≈80-100 步）之外；防死循环由
  # stall/repeat/预算兜底。
  thresholds:
  - 8
  - 16
  - 24
  - 96
  # 步数硬上限需大于心跳阈值（96），否则步数墙先于心跳触发。
  max_steps: 120
  # 跨题并行 worker 数：对齐平台 3 环境上限（题内串行见 concurrency）。
  # 2026-11-19 用户验收"单引擎验收"通过：三题并行、题内 intent 串行，
  # 以 parallel_acceptance 显式放行（config.py 校验闸门）。
  parallel_acceptance: true
  parallel_agents: 3
  max_tool_rounds: 40
harness:
  protocol: arena
  competition_locked: false
  arena:
    base_url: http://10.201.0.77:8090
    auto_start: true
    # prewarm: 读题时预启动前 max_envs 个环境；on_demand: 每个意图执行前按需拉起。
    # 串行执行器下 on_demand 更省槽位，也避免空闲环境过期。
    env_policy: on_demand
    max_envs: 3
    client_timeout_seconds: 40
