runtime:
  worker_lease_seconds: 180
  heartbeat_seconds: 15
  intent_poll_seconds: 2
  retry_backoff_seconds: 2
app:
  mode: practice
concurrency:
  max_workers: 4
  # 题内串行：同题同时只跑 1 个意图（会话状态共享，并发写会打架）。
  # 跨题并行度由 controller.parallel_agents 控制。
  max_project_workers: 1
  # 平台环境上限 3 个（409 environment_limit）：在跑题数不超过 3。
  max_running_projects: 3
  executor: serial
budget:
  # 按 25 题正式赛规模校准（只考虑合理性，不考虑费用）：
  # - 单意图 40 轮 ≈ 40-55 万 token、10-20 分钟
  # - 单题会话按 2-3 个意图规划 → 100 万 token / 90 分钟上限
  # - claim_timeout 是单意图硬超时，必须大于 40 轮的墙钟时间
  per_challenge_seconds: 5400
  claim_timeout_seconds: 1800
  max_model_tokens_per_intent: 1000000
  max_tool_calls_per_intent: 300
  # 运行级全局上限：25 题 × 预期 ~80 万均值，防绕圈止损（非费用控制）
  max_model_tokens_total: 20000000
  repeat_limit: 8
  stall_steps: 60
  # 终局加时：全部可解题做完且剩余时间 > endgame_min_seconds 时，对预算
  # 耗尽（stopped）的题授权一次追加额度——token/工具上限 ×(1+bonus)、
  # 会话有效期延到运行截止。0 = 关闭。累计账本不清零，硬停止语义保留。
  endgame_token_bonus: 0.5
  # Pro（换挡模型）每题调用硬上限：防烧穿全局预算；Pro/Flash 走同一账本。
  pro_max_calls_per_challenge: 8
download:
  max_single_bytes: 20971520
  max_total_bytes: 104857600
policy:
  authorized_scope: []
  web_search: false
  runtime_install: false
  sandbox_required: false
  command_allowlist:
  - python3
  - unzip
  - zip
  - xz
  - bzip2
  - zstd
  - strings
  - objdump
  - readelf
  - nm
  - file
  - binwalk
  - foremost
  - fls
  - icat
  - mmls
  - exiftool
  - 7z
  - steghide
  - pngcheck
  - openssl
  - xxd
  - jq
  - gdb
  - pwn
  - ROPgadget
  - cstool
  - checksec
  - patchelf
  - z3
  - strace
  - ltrace
  - qemu-x86_64
  - qemu-aarch64
  - pdftotext
  - pdfinfo
  - qrencode
  - tesseract
  - zbarimg
  authorized_arena_targets:
  - 10.201.0.0/16
model:
  provider: baizhi_anthropic
  base_url: https://ai-api-gateway.app.baizhi.cloud/api/anthropic
  model: deepseek-flash
  api_key_env: BAIZHI_API_KEY
  max_tokens: 4096
  tools_enabled: true
  # 双模型换挡（借鉴 Tsecbench 冠军方案"Flash 高频探索 + Pro 关键决策"）：
  # pro_model 非空时，stage>=pro_from_stage 的换路径回合与提交前评审路由到
  # Pro（同一网关同一凭据）；调用失败/每题次数超限自动回退主模型（fail-open）。
  # 模型 ID 待确认网关支持后填入；空 = 不启用，行为与单模型完全一致。
  pro_model: ""
  pro_from_stage: 2
  # 旋钮一：思考模式按步数路线阶段分配预算（token），0=关。对应口诀
  # "侦察关思考（防 Flash 思维过载），攻坚多想（Pro 控预算）"：
  # stage0 侦察/简单验证不开思考；stage1 轻思考；stage2 换路径攻坚开大；
  # stage3/4 止损阶段归零。网关不支持 thinking 参数时自动粘滞回退。
  # Pro 深思考轮数由 budget.pro_max_calls_per_challenge 兜底（每题 ≤8 次）。
  thinking_by_stage: [0, 4000, 8000, 0, 0]
storage:
  db_path: data/practice.db
controller:
  thresholds:
  - 30
  - 50
  - 70
  - 100
  # 步数窗口按意图重置（reset_intent_window），200 是单意图止损上限，
  # 覆盖 40 轮工具调用的目标用量还有余量
  max_steps: 200
  # 跨题并行 worker 数：对齐平台 3 环境上限（题内串行见 concurrency）。
  parallel_agents: 3
  max_tool_rounds: 40
harness:
  protocol: arena
  competition_locked: false
  arena:
    base_url: http://10.201.0.97:8090
    auto_start: true
    # prewarm: 读题时预启动前 max_envs 个环境；on_demand: 每个意图执行前按需拉起。
    # 串行执行器下 on_demand 更省槽位，也避免空闲环境过期。
    env_policy: on_demand
    max_envs: 3
    client_timeout_seconds: 40
