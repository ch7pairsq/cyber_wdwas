runtime:
  worker_lease_seconds: 180
  heartbeat_seconds: 15
  intent_poll_seconds: 2
  retry_backoff_seconds: 2
app:
  mode: practice
concurrency:
  max_workers: 4
  max_project_workers: 2
  max_running_projects: 3
  executor: serial
budget:
  # 按 25 题正式赛规模校准（只考虑合理性，不考虑费用）：
  # - 单意图 40 轮 ≈ 40-55 万 token、10-20 分钟
  # - 单题会话按 2-3 个意图规划 → 100 万 token / 90 分钟上限
  # - claim_timeout 是单意图硬超时，必须大于 40 轮的墙钟时间
  per_challenge_seconds: 5400
  claim_timeout_seconds: 1800
  max_model_tokens_per_intent: 1000000
  max_tool_calls_per_intent: 300
  # 运行级全局上限：25 题 × 预期 ~80 万均值，防绕圈止损（非费用控制）
  max_model_tokens_total: 20000000
  repeat_limit: 8
  stall_steps: 60
download:
  max_single_bytes: 20971520
  max_total_bytes: 104857600
policy:
  authorized_scope: []
  web_search: false
  runtime_install: false
  sandbox_required: false
  command_allowlist:
  - python3
  - unzip
  - zip
  - xz
  - bzip2
  - zstd
  - strings
  - objdump
  - readelf
  - nm
  - file
  - binwalk
  - foremost
  - fls
  - icat
  - mmls
  - exiftool
  - 7z
  - steghide
  - pngcheck
  - openssl
  - xxd
  - jq
  - gdb
  - pwn
  - ROPgadget
  - cstool
  - checksec
  - patchelf
  - z3
  - strace
  - ltrace
  - qemu-x86_64
  - qemu-aarch64
  - pdftotext
  - pdfinfo
  - qrencode
  - zbarimg
  authorized_arena_targets:
  - 10.201.0.0/16
model:
  provider: baizhi_anthropic
  base_url: https://ai-api-gateway.app.baizhi.cloud/api/anthropic
  model: deepseek-flash
  api_key_env: BAIZHI_API_KEY
  max_tokens: 4096
  tools_enabled: true
storage:
  db_path: data/practice.db
controller:
  thresholds:
  - 30
  - 50
  - 70
  - 100
  # 步数窗口按意图重置（reset_intent_window），200 是单意图止损上限，
  # 覆盖 40 轮工具调用的目标用量还有余量
  max_steps: 200
  parallel_agents: 1
  max_tool_rounds: 40
harness:
  protocol: arena
  competition_locked: false
  arena:
    base_url: http://10.201.0.97:8090
    auto_start: true
    # prewarm: 读题时预启动前 max_envs 个环境；on_demand: 每个意图执行前按需拉起。
    # 串行执行器下 on_demand 更省槽位，也避免空闲环境过期。
    env_policy: on_demand
    max_envs: 3
    client_timeout_seconds: 40
